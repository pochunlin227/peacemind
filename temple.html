<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e9e4d8">
<title>麻糬小寺</title>
<style>
  :root {
    --sky-top: #e6e8de;
    --sky-bot: #f3ecdf;
    --mtn1: #c9d2c0;
    --mtn2: #b3c0aa;
    --floor: #ece3d3;
    --floor-line: #ddd1bd;
    --path: #e2d6c2;
    --wood: #b07a4f;
    --wood-dark: #8d5c38;
    --roof: #6f7d6a;
    --roof-dark: #5a6756;
    --wall: #f6efe3;
    --door: #f7d9a8;
    --tree: #a9bb9c;
    --tree-dark: #8fa483;
    --trunk: #9c7a5c;
    --pond: #bcd3cf;
    --pond-edge: #a8bfb9;
    --lotus: #f2bcc0;
    --cushion: #c97f6b;
    --cushion-dark: #a9634f;
    --lantern: #f3c98b;
    --ink: #5f5245;
    --ink-soft: #5f524566;
    --ui-bg: #fffaf2cc;
    --cheek: #f4b2ab;
    --leaf: #9fb592;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sky-top: #1b1e24;
      --sky-bot: #2a2a2c;
      --mtn1: #2f3532;
      --mtn2: #262c29;
      --floor: #3a3530;
      --floor-line: #33302b;
      --path: #423c35;
      --wood: #8a5f3e;
      --wood-dark: #6b472d;
      --roof: #3f4a40;
      --roof-dark: #323b33;
      --wall: #4a4440;
      --door: #e8b46c;
      --tree: #4d5c47;
      --tree-dark: #3e4b39;
      --trunk: #5e4a39;
      --pond: #2e4446;
      --pond-edge: #283a3b;
      --lotus: #c98c91;
      --cushion: #9a5e4e;
      --cushion-dark: #7c4a3c;
      --lantern: #f0b763;
      --ink: #e4d8c7;
      --ink-soft: #e4d8c766;
      --ui-bg: #2a2724cc;
      --cheek: #d98f88;
      --leaf: #7e9572;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--floor); }
  body {
    color: var(--ink);
    font-family: "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }

  /* ---------- characters ---------- */
  .mochi .body { transform-box: fill-box; transform-origin: 50% 100%; animation: idle 3.6s ease-in-out infinite; }
  .mochi.walking .body { animation: hop .36s ease-in-out infinite; }
  .mochi.bowing .body { animation: bow 1.8s ease-in-out; }
  .mochi.breathing .body { animation: none; }
  @keyframes idle { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.02,1.035); } }
  @keyframes hop { 0%,100% { transform: translateY(0) scale(1.03,.97); } 50% { transform: translateY(-7px) scale(.98,1.03); } }
  @keyframes bow {
    0% { transform: scale(1,1); }
    30%, 65% { transform: scale(1.12,.72); }
    100% { transform: scale(1,1); }
  }
  .mochi .hands { opacity: 0; transition: opacity .4s; }
  .mochi.palms .hands { opacity: 1; }
  .mochi .tag { font-size: 13px; letter-spacing: .1em; fill: var(--ink); opacity: .6; }

  .float { font-size: 18px; fill: var(--ink); animation: floatUp 2.2s ease-out forwards; pointer-events: none; }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(6px); } 20% { opacity: .9; } 100% { opacity: 0; transform: translateY(-40px); } }
  .ring { fill: none; stroke: var(--wood); stroke-width: 2; opacity: .5; transform-box: fill-box; transform-origin: center; animation: ring 1.4s ease-out forwards; pointer-events: none; }
  @keyframes ring { from { transform: scale(.4); opacity: .6; } to { transform: scale(2.4); opacity: 0; } }

  .lantern-glow { animation: flicker 4s ease-in-out infinite; }
  @keyframes flicker { 0%,100% { opacity: .45; } 50% { opacity: .7; } }

  /* falling leaves */
  .petal { position: fixed; top: -20px; width: 10px; height: 6px; border-radius: 50%;
           background: var(--lotus); opacity: .7; pointer-events: none;
           animation: fall linear forwards; }
  @keyframes fall {
    to { transform: translate(var(--dx), 110vh) rotate(540deg); }
  }

  /* ---------- UI ---------- */
  .top {
    position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px; pointer-events: none;
  }
  .pill {
    pointer-events: auto; background: var(--ui-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; letter-spacing: .08em;
    border: 1px solid var(--ink-soft);
  }
  .pill button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  .hint {
    position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 52px); left: 0; right: 0;
    text-align: center; font-size: 13px; letter-spacing: .12em; opacity: .65; pointer-events: none;
    transition: opacity .8s;
  }

  .actions {
    position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 6px; border-radius: 22px;
    background: var(--ui-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--ink-soft); max-width: calc(100vw - 32px);
  }
  .actions button {
    font: inherit; color: var(--ink); background: transparent; border: 0; border-radius: 16px;
    width: 64px; padding: 8px 0 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 12px; letter-spacing: .1em;
  }
  .actions button svg { width: 24px; height: 24px; }
  .actions button[aria-pressed="true"] { background: var(--ink); color: var(--floor); }

  .panel {
    position: fixed; left: 0; right: 0; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 84px);
    text-align: center; pointer-events: none; opacity: 0; transition: opacity .5s;
  }
  .panel.show { opacity: 1; }
  .panel .big { font-size: 22px; letter-spacing: .4em; padding-left: .4em; }
  .panel .small { font-size: 13px; letter-spacing: .15em; opacity: .6; margin-top: 6px; }
  .panel .track { width: 160px; height: 4px; margin: 12px auto 0; border-radius: 4px; background: var(--ink-soft); overflow: hidden; }
  .panel .track div { height: 100%; width: 0; background: var(--wood); }

  .beads { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
  .beads span { width: 12px; height: 12px; border-radius: 50%; background: var(--wood); opacity: .3; transition: opacity .3s, transform .3s; }
  .beads span.on { opacity: 1; transform: scale(1.15); }
</style>
</head>
<body>
<svg id="scene" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--sky-top)"/>
      <stop offset="1" stop-color="var(--sky-bot)"/>
    </linearGradient>
    <radialGradient id="lglow">
      <stop offset="0" stop-color="var(--lantern)" stop-opacity=".9"/>
      <stop offset="1" stop-color="var(--lantern)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky & mountains (extend far up so tall phones never see an edge) -->
  <rect x="-500" y="-900" width="2000" height="1300" fill="url(#sky)"/>
  <circle cx="760" cy="120" r="34" fill="var(--door)" opacity=".55"/>
  <path d="M-500 330 L -100 330 C 40 230, 120 170, 230 220 C 320 160, 420 120, 520 200 C 620 140, 720 150, 820 230 C 900 190, 1000 200, 1100 260 L 1500 330 L 1500 420 L -500 420 Z" fill="var(--mtn1)"/>
  <path d="M-500 360 L 0 360 C 120 270, 220 270, 330 320 C 440 260, 560 250, 660 310 C 760 270, 880 280, 1000 330 L 1500 360 L 1500 420 L -500 420 Z" fill="var(--mtn2)"/>

  <!-- courtyard floor (extends far down) -->
  <rect x="-500" y="380" width="2000" height="1400" fill="var(--floor)"/>
  <g stroke="var(--floor-line)" stroke-width="2" opacity=".8">
    <line x1="-500" y1="430" x2="1500" y2="430"/>
    <line x1="-500" y1="500" x2="1500" y2="500"/>
    <line x1="-500" y1="590" x2="1500" y2="590"/>
    <line x1="-500" y1="700" x2="1500" y2="700"/>
    <line x1="-500" y1="830" x2="1500" y2="830"/>
  </g>
  <!-- stone path to the hall -->
  <path d="M455 400 L 545 400 L 620 1400 L 380 1400 Z" fill="var(--path)"/>

  <!-- trees -->
  <g>
    <rect x="132" y="250" width="16" height="150" rx="6" fill="var(--trunk)"/>
    <circle cx="140" cy="240" r="62" fill="var(--tree)"/>
    <circle cx="100" cy="270" r="40" fill="var(--tree-dark)"/>
    <circle cx="180" cy="275" r="38" fill="var(--tree-dark)"/>
    <rect x="852" y="260" width="16" height="140" rx="6" fill="var(--trunk)"/>
    <circle cx="860" cy="250" r="58" fill="var(--tree)"/>
    <circle cx="900" cy="282" r="36" fill="var(--tree-dark)"/>
    <circle cx="822" cy="280" r="34" fill="var(--tree-dark)"/>
  </g>

  <!-- the little hall -->
  <g>
    <rect x="330" y="372" width="340" height="22" rx="4" fill="var(--wood-dark)" opacity=".5"/>
    <rect x="350" y="268" width="300" height="108" fill="var(--wall)"/>
    <rect x="360" y="268" width="12" height="108" fill="var(--wood)"/>
    <rect x="628" y="268" width="12" height="108" fill="var(--wood)"/>
    <rect x="455" y="290" width="90" height="86" rx="4" fill="var(--door)"/>
    <line x1="500" y1="290" x2="500" y2="376" stroke="var(--wood)" stroke-width="3"/>
    <g fill="none" stroke="var(--wood)" stroke-width="2" opacity=".7">
      <rect x="390" y="296" width="44" height="50" rx="3"/>
      <rect x="566" y="296" width="44" height="50" rx="3"/>
      <line x1="412" y1="296" x2="412" y2="346"/><line x1="390" y1="321" x2="434" y2="321"/>
      <line x1="588" y1="296" x2="588" y2="346"/><line x1="566" y1="321" x2="610" y2="321"/>
    </g>
    <!-- soft curved roof -->
    <path d="M300 276 C 340 262, 360 232, 400 214 L 600 214 C 640 232, 660 262, 700 276 C 690 282, 670 280, 650 272 L 350 272 C 330 280, 310 282, 300 276 Z" fill="var(--roof)"/>
    <path d="M390 214 C 420 196, 580 196, 610 214 Z" fill="var(--roof-dark)"/>
    <circle cx="500" cy="196" r="7" fill="var(--door)"/>
    <!-- sign -->
    <rect x="470" y="242" width="60" height="22" rx="4" fill="var(--wood-dark)"/>
    <text x="500" y="258" text-anchor="middle" font-size="13" fill="var(--door)" letter-spacing="3">靜心</text>
  </g>

  <!-- lanterns -->
  <g id="lanterns">
    <g transform="translate(330 400)">
      <circle class="lantern-glow" cx="0" cy="-40" r="36" fill="url(#lglow)"/>
      <rect x="-4" y="-20" width="8" height="24" fill="var(--wood-dark)"/>
      <rect x="-14" y="-52" width="28" height="32" rx="8" fill="var(--lantern)"/>
      <rect x="-16" y="-56" width="32" height="6" rx="3" fill="var(--wood-dark)"/>
    </g>
    <g transform="translate(670 400)">
      <circle class="lantern-glow" cx="0" cy="-40" r="36" fill="url(#lglow)" style="animation-delay:-2s"/>
      <rect x="-4" y="-20" width="8" height="24" fill="var(--wood-dark)"/>
      <rect x="-14" y="-52" width="28" height="32" rx="8" fill="var(--lantern)"/>
      <rect x="-16" y="-56" width="32" height="6" rx="3" fill="var(--wood-dark)"/>
    </g>
  </g>

  <!-- pond -->
  <g>
    <ellipse cx="320" cy="640" rx="96" ry="34" fill="var(--pond-edge)"/>
    <ellipse cx="320" cy="636" rx="88" ry="28" fill="var(--pond)"/>
    <ellipse cx="290" cy="632" rx="16" ry="6" fill="var(--tree)"/>
    <ellipse cx="350" cy="642" rx="13" ry="5" fill="var(--tree)"/>
    <circle cx="292" cy="628" r="5" fill="var(--lotus)"/>
    <circle cx="350" cy="638" r="4" fill="var(--lotus)"/>
  </g>

  <!-- cushions -->
  <g id="cushions"></g>

  <!-- characters + effects are inserted here and depth-sorted -->
  <g id="world"></g>
</svg>

<div class="top">
  <div class="pill" id="who">此刻有 4 位在這裡</div>
  <div class="pill"><button id="soundBtn">聲音 關</button></div>
</div>
<div class="hint" id="hint">點地面就能走過去 · 走到坐墊上可以坐下</div>

<div class="panel" id="panel">
  <div class="big" id="pBig"></div>
  <div class="small" id="pSmall"></div>
  <div class="track" id="pTrack"><div id="pFill"></div></div>
  <div class="beads" id="pBeads"></div>
</div>

<nav class="actions" aria-label="動作">
  <button data-act="palms" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9c0-3 -2-5-3-6-1 3-3 6-3 10v4l3 4"/><path d="M12 21V9c0-3 2-5 3-6 1 3 3 6 3 10v4l-3 4"/></svg>
    合掌</button>
  <button data-act="bow" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="7" r="3"/><path d="M4 20c0-5 3-8 7-8h3c3 0 5 2 6 5"/></svg>
    鞠躬</button>
  <button data-act="muyu" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 16c0-6 4-9 8-9s8 3 8 9c0 2-3 3-8 3s-8-1-8-3z"/><path d="M6 15c3 1.5 9 1.5 12 0"/><path d="M17 3l-3 5"/></svg>
    木魚</button>
  <button data-act="beads" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="4.5" r="2"/><circle cx="18.5" cy="8.5" r="2"/><circle cx="18.5" cy="15.5" r="2"/><circle cx="12" cy="19.5" r="2"/><circle cx="5.5" cy="15.5" r="2"/><circle cx="5.5" cy="8.5" r="2"/></svg>
    念珠</button>
  <button data-act="breathe" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 9h11a3 3 0 1 0-3-3"/><path d="M3 14h15a3 3 0 1 1-3 3"/></svg>
    呼吸</button>
</nav>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("scene");
  const world = document.getElementById("world");
  const cushionsG = document.getElementById("cushions");
  const hint = document.getElementById("hint");
  const panel = document.getElementById("panel");
  const pBig = document.getElementById("pBig");
  const pSmall = document.getElementById("pSmall");
  const pTrack = document.getElementById("pTrack");
  const pFill = document.getElementById("pFill");
  const pBeads = document.getElementById("pBeads");
  const el = (tag, attrs = {}, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };

  /* ---------- viewport: keep the courtyard framed on any screen shape ---------- */
  let view = { x: 0, y: 0, w: 1000, h: 700 };
  function fitView() {
    const aspect = innerWidth / innerHeight;
    const w = aspect >= 1.1 ? 1000 : aspect >= .8 ? 760 : 560;
    const h = w / aspect;
    const cy = aspect >= 1.1 ? 400 : 470;      // centre the courtyard, a bit lower on tall screens
    view = { x: 500 - w / 2, y: cy - h / 2, w, h };
    svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
  }
  fitView();
  addEventListener("resize", fitView);

  const bounds = () => ({
    minX: Math.max(80, view.x + 40), maxX: Math.min(920, view.x + view.w - 40),
    minY: 412, maxY: Math.min(900, view.y + view.h - 130)
  });
  const pond = { cx: 320, cy: 638, rx: 120, ry: 52 };
  function clampTarget(x, y) {
    const b = bounds();
    x = Math.min(b.maxX, Math.max(b.minX, x));
    y = Math.min(b.maxY, Math.max(b.minY, y));
    const dx = (x - pond.cx) / pond.rx, dy = (y - pond.cy) / pond.ry, d = Math.hypot(dx, dy);
    if (d < 1) { const k = 1 / (d || 1); x = pond.cx + dx * k * pond.rx; y = pond.cy + dy * k * pond.ry; }
    return [x, y];
  }
  const depthScale = (y) => 0.78 + (y - 400) / 300 * 0.4;

  /* ---------- cushions ---------- */
  const cushions = [
    { x: 420, y: 456 }, { x: 500, y: 452 }, { x: 580, y: 456 },
    { x: 440, y: 540 }, { x: 560, y: 540 }
  ];
  cushions.forEach(c => {
    const s = depthScale(c.y);
    const g = el("g", { transform: `translate(${c.x} ${c.y}) scale(${s})` }, cushionsG);
    el("ellipse", { cx: 0, cy: 4, rx: 38, ry: 13, fill: "var(--cushion-dark)" }, g);
    el("ellipse", { cx: 0, cy: 0, rx: 36, ry: 12, fill: "var(--cushion)" }, g);
    c.taken = null;
  });

  /* ---------- characters ---------- */
  function makeMochi({ color, shade, leaf, name }) {
    const root = el("g", { class: "mochi" }, world);
    el("ellipse", { cx: 0, cy: 2, rx: 34, ry: 7, fill: "#000", opacity: .08 }, root);
    const body = el("g", { class: "body" }, root);
    el("path", { d: "M-40 0 C -46 -38, -24 -64, 0 -64 C 24 -64, 46 -38, 40 0 C 38 6, -38 6, -40 0 Z", fill: color, stroke: shade, "stroke-width": 2.5 }, body);
    el("path", { d: "M-36 -6 C -14 4, 14 4, 36 -6 C 36 2, 20 4, 0 4 C -20 4, -36 2, -36 -6 Z", fill: shade, opacity: .5 }, body);
    const eyes = el("g", { stroke: "var(--ink)", "stroke-width": 2.6, "stroke-linecap": "round", fill: "none" }, body);
    el("path", { d: "M-19 -32 q 6 5 12 0" }, eyes);
    el("path", { d: "M7 -32 q 6 5 12 0" }, eyes);
    el("ellipse", { cx: -25, cy: -22, rx: 7, ry: 4, fill: "var(--cheek)", opacity: .75 }, body);
    el("ellipse", { cx: 25, cy: -22, rx: 7, ry: 4, fill: "var(--cheek)", opacity: .75 }, body);
    el("path", { d: "M-4 -23 q 4 3 8 0", stroke: "var(--ink)", "stroke-width": 2, "stroke-linecap": "round", fill: "none" }, body);
    if (leaf) {
      el("path", { d: "M0 -63 C -2 -74, 4 -82, 14 -84 C 16 -74, 10 -66, 0 -63 Z", fill: "var(--leaf)" }, body);
    }
    const hands = el("g", { class: "hands" }, body);
    el("ellipse", { cx: -4, cy: -10, rx: 6, ry: 10, fill: color, stroke: shade, "stroke-width": 2, transform: "rotate(12 -4 -10)" }, hands);
    el("ellipse", { cx: 4, cy: -10, rx: 6, ry: 10, fill: color, stroke: shade, "stroke-width": 2, transform: "rotate(-12 4 -10)" }, hands);
    if (name) el("text", { class: "tag", x: 0, y: 24, "text-anchor": "middle" }, root).textContent = name;
    return { root, body };
  }

  function spawn(opts, x, y) {
    const m = makeMochi(opts);
    const c = { ...opts, ...m, x, y, tx: x, ty: y, speed: opts.speed || 130, seat: null, busy: 0 };
    place(c);
    return c;
  }
  function place(c) {
    c.root.setAttribute("transform", `translate(${c.x.toFixed(1)} ${c.y.toFixed(1)}) scale(${depthScale(c.y).toFixed(3)})`);
  }

  const me = spawn({ color: "#fffaf2", shade: "#e8dccb", leaf: true, name: "你" }, 500, 580);
  const others = [
    spawn({ color: "#fde4e1", shade: "#efc9c3", name: "", speed: 70 }, 420, 456),
    spawn({ color: "#e6efdc", shade: "#cbd9bd", name: "", speed: 70 }, 640, 600),
    spawn({ color: "#efe3f6", shade: "#d6c6e2", name: "", speed: 70 }, 580, 456),
  ];
  cushions[0].taken = others[0]; others[0].seat = cushions[0];
  cushions[2].taken = others[2]; others[2].seat = cushions[2];
  const everyone = [me, ...others];

  /* ---------- effects ---------- */
  function floatText(c, text) {
    const s = depthScale(c.y);
    const t = el("text", { class: "float", x: c.x, y: c.y - 86 * s, "text-anchor": "middle" }, world);
    t.textContent = text;
    setTimeout(() => t.remove(), 2300);
  }
  function ringAt(c) {
    const s = depthScale(c.y);
    const r = el("circle", { class: "ring", cx: c.x, cy: c.y - 30 * s, r: 24 * s }, world);
    setTimeout(() => r.remove(), 1500);
  }
  function retrigger(node, cls, ms) {
    node.classList.remove(cls); void node.getBBox(); node.classList.add(cls);
    if (ms) setTimeout(() => node.classList.remove(cls), ms);
  }

  /* ---------- sound ---------- */
  let ctx = null, master = null, soundOn = false, ambient = null, bellTimer = null;
  function audio() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function knockSound(vol = 1) {
    if (!soundOn) return;
    audio(); const t = ctx.currentTime, base = 380 * (0.97 + Math.random() * .06);
    [[1, .55, .28], [2.32, .18, .1], [3.9, .07, .05]].forEach(([m, a, d]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(base * m * 1.04, t); o.frequency.exponentialRampToValueAtTime(base * m, t + .03);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(a * vol, t + .003); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .02);
    });
  }
  function beadSound() {
    if (!soundOn) return;
    audio(); const t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "triangle"; o.frequency.value = 1500 + Math.random() * 200;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.08, t + .002); g.gain.exponentialRampToValueAtTime(.0001, t + .06);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .08);
  }
  function bell() {
    if (!soundOn) return;
    audio(); const t = ctx.currentTime;
    [[196, .16, 7], [196 * 2.01, .07, 5], [196 * 2.98, .04, 3.5], [196 * 4.1, .02, 2]].forEach(([f, a, d]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(a, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(master); o.start(t); o.stop(t + d);
    });
  }
  function startAmbient() {
    audio();
    const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 500;
    const g = ctx.createGain(); g.gain.value = .0001;
    const lfo = ctx.createOscillator(), lfoG = ctx.createGain();
    lfo.frequency.value = .07; lfoG.gain.value = .025; lfo.connect(lfoG); lfoG.connect(g.gain);
    src.connect(lp); lp.connect(g); g.connect(master);
    g.gain.setTargetAtTime(.04, ctx.currentTime, 2);
    src.start(); lfo.start();
    ambient = { src, lfo, g };
    bell();
    bellTimer = setInterval(bell, 45000);
  }
  function stopAmbient() {
    if (ambient) { ambient.g.gain.setTargetAtTime(.0001, ctx.currentTime, .5); const a = ambient; setTimeout(() => { a.src.stop(); a.lfo.stop(); }, 1500); ambient = null; }
    clearInterval(bellTimer);
  }
  const soundBtn = document.getElementById("soundBtn");
  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "聲音 開" : "聲音 關";
    soundOn ? startAmbient() : stopAmbient();
  });

  /* ---------- modes ---------- */
  let mode = "walk";
  const buttons = [...document.querySelectorAll(".actions button")];
  function setPressed(act) { buttons.forEach(b => b.setAttribute("aria-pressed", b.dataset.act === act)); }

  function showPanel(big, small, { track = false, beads = false } = {}) {
    pBig.textContent = big; pSmall.textContent = small;
    pTrack.style.display = track ? "block" : "none";
    pBeads.style.display = beads ? "flex" : "none";
    panel.classList.add("show");
  }
  const hidePanel = () => panel.classList.remove("show");

  function setMode(next) {
    if (mode === "breathe") stopBreathing();
    mode = next === mode ? "walk" : next;
    setPressed(mode === "walk" ? null : mode);
    if (mode === "walk") { hidePanel(); hint.style.opacity = .65; hint.textContent = "點地面就能走過去 · 走到坐墊上可以坐下"; }
    if (mode === "muyu") { hint.style.opacity = 0; showPanel("敲木魚", "點畫面任何地方，叩一聲"); }
    if (mode === "beads") { hint.style.opacity = 0; beadCount = 0; renderBeads(); showPanel("撥念珠", "點一下撥一顆，一顆一個呼吸", { beads: true }); }
    if (mode === "breathe") { hint.style.opacity = 0; startBreathing(); }
  }

  function doPalms(c) {
    retrigger(c.root, "palms", 2400);
    if (c === me) floatText(c, "合掌");
  }
  function doBow(c) {
    retrigger(c.root, "bowing", 1800);
    if (c === me) setTimeout(() => floatText(c, "謝謝自己"), 500);
  }
  function doKnock(c, quiet) {
    ringAt(c); floatText(c, "叩");
    knockSound(quiet ? .25 : 1);
  }

  buttons.forEach(b => b.addEventListener("click", (e) => {
    e.stopPropagation();
    const act = b.dataset.act;
    if (act === "palms") { if (mode === "breathe") setMode("walk"); doPalms(me); return; }
    if (act === "bow") { if (mode === "breathe") setMode("walk"); doBow(me); return; }
    setMode(act);
  }));

  /* beads */
  let beadCount = 0; const BEADS = 9;
  function renderBeads() {
    pBeads.innerHTML = "";
    for (let i = 0; i < BEADS; i++) {
      const s = document.createElement("span");
      if (i < beadCount % BEADS || (beadCount > 0 && beadCount % BEADS === 0)) s.className = "on";
      pBeads.appendChild(s);
    }
    pSmall.textContent = beadCount ? `第 ${beadCount} 顆` : "點一下撥一顆，一顆一個呼吸";
  }

  /* breathing: 4s in, 6s out, sitting on the nearest cushion */
  const IN = 4000, OUT = 6000;
  let breathStart = 0, breathing = false;
  const ease = x => .5 - .5 * Math.cos(Math.PI * x);
  function nearestFreeCushion(c) {
    let best = null, bd = Infinity;
    cushions.forEach(k => { if (k.taken && k.taken !== c) return; const d = Math.hypot(k.x - c.x, k.y - c.y); if (d < bd) { bd = d; best = k; } });
    return best;
  }
  function startBreathing() {
    const k = me.seat || nearestFreeCushion(me);
    if (k) walkTo(me, k.x, k.y, true);
    breathing = true; breathStart = performance.now();
    me.root.classList.add("breathing");
    showPanel("吸氣", "跟著小麻糬，肚子鼓起來", { track: true });
  }
  function stopBreathing() {
    breathing = false;
    me.root.classList.remove("breathing");
    me.body.style.transform = "";
  }
  function breathFrame(now) {
    const t = (now - breathStart) % (IN + OUT);
    let b, p;
    if (t < IN) { p = t / IN; b = ease(p); if (pBig.textContent !== "吸氣") { pBig.textContent = "吸氣"; pSmall.textContent = "肚子鼓起來"; } }
    else { p = (t - IN) / OUT; b = 1 - ease(p); if (pBig.textContent !== "吐氣") { pBig.textContent = "吐氣"; pSmall.textContent = "慢慢吐，比吸氣長一點"; } }
    pFill.style.width = (p * 100).toFixed(1) + "%";
    if (!me.moving) me.body.style.transform = `scale(${1 + b * .08}, ${1 + b * .14})`;
  }

  /* ---------- movement ---------- */
  function walkTo(c, x, y, toSeat) {
    if (c.seat && c.seat.taken === c) c.seat.taken = null;
    c.seat = null;
    [c.tx, c.ty] = toSeat ? [x, y] : clampTarget(x, y);
    if (toSeat) { const k = cushions.find(k => k.x === x && k.y === y); if (k) { k.taken = c; c.seat = k; } }
    c.moving = true;
  }
  function snapSeat(c) {
    if (c.seat) return;
    const k = cushions.find(k => (!k.taken || k.taken === c) && Math.hypot(k.x - c.x, k.y - c.y) < 34);
    if (k) { k.taken = c; c.seat = k; c.tx = k.x; c.ty = k.y; c.moving = true;
             if (c === me && mode === "walk") floatText(c, "坐下來了"); }
  }

  svg.addEventListener("pointerdown", (e) => {
    if (mode === "muyu") { doKnock(me); if (navigator.vibrate) navigator.vibrate(12); return; }
    if (mode === "beads") { beadCount++; beadSound(); renderBeads(); if (navigator.vibrate) navigator.vibrate(8); if (beadCount % BEADS === 0) floatText(me, "一圈了"); return; }
    if (mode === "breathe") return;
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    walkTo(me, p.x, p.y);
    hint.style.opacity = 0;
  });
  document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" || e.repeat) return;
    e.preventDefault();
    if (mode === "muyu") doKnock(me);
    if (mode === "beads") { beadCount++; beadSound(); renderBeads(); }
  });

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    everyone.forEach(c => {
      if (!c.moving) return;
      const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy);
      const step = c.speed * dt;
      if (d <= step) { c.x = c.tx; c.y = c.ty; c.moving = false; c.root.classList.remove("walking"); snapSeat(c); }
      else { c.x += dx / d * step; c.y += dy / d * step; c.root.classList.add("walking"); }
      place(c);
    });
    // depth sort: whoever is lower on screen is in front
    const order = [...everyone].sort((a, b) => a.y - b.y);
    order.forEach(c => { if (world.lastElementChild !== c.root) world.appendChild(c.root); });
    if (breathing) breathFrame(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- the other little spirits ---------- */
  function npcTick(c) {
    const r = Math.random();
    if (c.seat) {
      if (r < .35) doKnock(c, true);
      else if (r < .5) doBow(c);
      else if (r < .6) doPalms(c);
      else if (r < .72) { const b = bounds(); walkTo(c, b.minX + Math.random() * (b.maxX - b.minX), 480 + Math.random() * 160); }
    } else {
      if (r < .5) { const k = nearestFreeCushion(c); if (k) walkTo(c, k.x, k.y, true); }
      else if (r < .75) { const b = bounds(); walkTo(c, b.minX + Math.random() * (b.maxX - b.minX), 440 + Math.random() * 200); }
      else doBow(c);
    }
    setTimeout(() => npcTick(c), 5000 + Math.random() * 7000);
  }
  others.forEach((c, i) => setTimeout(() => npcTick(c), 2500 + i * 2200));

  /* ---------- drifting petals ---------- */
  function petal() {
    const p = document.createElement("div");
    p.className = "petal";
    p.style.left = Math.random() * 100 + "vw";
    p.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    p.style.animationDuration = (9 + Math.random() * 8) + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 18000);
  }
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(petal, 2600);
})();
</script>
</body>
</html>
