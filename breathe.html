<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4ede2">
<title>跟麻糬呼吸</title>
<style>
  :root {
    --bg: #f4ede2;
    --bg2: #ebe1d1;
    --ink: #6b5a4a;
    --ink-soft: #a8968280;
    --mochi: #fffaf2;
    --mochi-shade: #efe4d4;
    --belly: #fff3e6;
    --cheek: #f4b2ab;
    --leaf: #9fb592;
    --leaf-dark: #7f9873;
    --glow: #f7d9b5;
    --track: #a8968233;
    --fill: #c9a27a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #23201e;
      --bg2: #1b1917;
      --ink: #d9cbb8;
      --ink-soft: #d9cbb855;
      --mochi: #ece3d6;
      --mochi-shade: #cfc3b2;
      --belly: #f5ece0;
      --cheek: #dc958e;
      --leaf: #7e9572;
      --leaf-dark: #64795a;
      --glow: #6b553d;
      --track: #d9cbb822;
      --fill: #b8946c;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 42%, var(--bg) 0%, var(--bg2) 100%);
    color: var(--ink);
    font-family: "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  .stage { position: relative; width: min(80vw, 360px); aspect-ratio: 1 / 1; }
  .stage svg { width: 100%; height: 100%; overflow: visible; }

  /* --b is breath amount 0..1, set every frame from JS */
  #glow { transform-origin: 180px 210px; transform-box: view-box;
          transform: scale(calc(0.85 + var(--b, 0) * 0.35)); opacity: calc(0.35 + var(--b, 0) * 0.45); }
  #mochi { transform-origin: 180px 292px; transform-box: view-box;
           transform: scale(calc(1 + var(--b, 0) * 0.08), calc(1 + var(--b, 0) * 0.13)); }
  #belly { transform-origin: 180px 250px; transform-box: view-box;
           transform: scale(calc(0.8 + var(--b, 0) * 0.35)); }
  #leaf  { transform-origin: 180px 128px; transform-box: view-box;
           transform: rotate(calc(-8deg + var(--b, 0) * 14deg)); }
  #shadow { transform-origin: 180px 296px; transform-box: view-box;
            transform: scaleX(calc(1 + var(--b, 0) * 0.1)); }

  .cue {
    margin-top: 10px; height: 2.4em; text-align: center;
    font-size: 22px; letter-spacing: .4em; padding-left: .4em;
    transition: opacity .6s ease;
  }
  .sub { display: block; font-size: 13px; letter-spacing: .2em; opacity: .55; margin-top: 6px; }

  .progress {
    width: min(50vw, 180px); height: 4px; border-radius: 4px; margin-top: 18px;
    background: var(--track); overflow: hidden;
  }
  .progress > div { height: 100%; width: 0; background: var(--fill); border-radius: 4px; }

  .bar {
    position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); left: 0; right: 0;
    display: flex; justify-content: center; gap: 12px; padding: 0 16px; flex-wrap: wrap;
  }
  .bar button {
    font: inherit; font-size: 14px; letter-spacing: .1em;
    color: var(--ink); background: transparent;
    border: 1.5px solid var(--ink-soft); border-radius: 999px;
    padding: 9px 18px; cursor: pointer;
  }
  .bar button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .rounds {
    position: fixed; top: max(28px, env(safe-area-inset-top)); left: 0; right: 0;
    text-align: center; font-size: 14px; letter-spacing: .2em; opacity: .5;
  }

  @media (prefers-reduced-motion: reduce) {
    #leaf { transform: none; }
  }
</style>
</head>
<body>
  <div class="rounds" id="rounds">跟著麻糬一起呼吸</div>

  <div class="stage">
    <svg viewBox="0 0 360 340" aria-hidden="true">
      <circle id="glow" cx="180" cy="210" r="140" fill="var(--glow)"/>
      <ellipse id="shadow" cx="180" cy="298" rx="105" ry="12" fill="var(--ink)" opacity=".08"/>

      <g id="mochi">
        <!-- body: soft dome with a flat, slightly spread bottom -->
        <path d="M70 280 C 58 200, 105 135, 180 135 C 255 135, 302 200, 290 280 C 287 296, 268 298, 180 298 C 92 298, 73 296, 70 280 Z"
              fill="var(--mochi)" stroke="var(--mochi-shade)" stroke-width="3"/>
        <!-- soft shading at the bottom -->
        <path d="M78 272 C 120 292, 240 292, 282 272 C 284 290, 264 296, 180 296 C 96 296, 76 290, 78 272 Z" fill="var(--mochi-shade)" opacity=".6"/>
        <!-- belly that swells -->
        <ellipse id="belly" cx="180" cy="250" rx="52" ry="30" fill="var(--belly)" stroke="var(--mochi-shade)" stroke-width="2" opacity=".9"/>
        <!-- face -->
        <g stroke="var(--ink)" stroke-width="4" stroke-linecap="round" fill="none">
          <path d="M136 205 q 10 8 20 0"/>
          <path d="M204 205 q 10 8 20 0"/>
        </g>
        <ellipse cx="124" cy="222" rx="13" ry="7" fill="var(--cheek)" opacity=".75"/>
        <ellipse cx="236" cy="222" rx="13" ry="7" fill="var(--cheek)" opacity=".75"/>
        <!-- mouth: small smile on inhale, little "o" on exhale -->
        <path id="smile" d="M172 220 q 8 6 16 0" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" fill="none"/>
        <ellipse id="oh" cx="180" cy="222" rx="4" ry="5" fill="var(--ink)" opacity="0"/>
        <!-- leaf on top -->
        <g id="leaf">
          <path d="M180 138 C 176 120, 186 108, 200 104 C 204 120, 194 134, 180 138 Z" fill="var(--leaf)"/>
          <path d="M181 136 C 186 124, 192 114, 198 108" stroke="var(--leaf-dark)" stroke-width="2" fill="none" stroke-linecap="round"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="cue" id="cue">吸氣<span class="sub" id="sub">用鼻子，慢慢的</span></div>
  <div class="progress"><div id="fill"></div></div>

  <div class="bar">
    <button id="vibBtn" aria-pressed="false">震動 關</button>
    <button id="pauseBtn">暫停</button>
  </div>

<script>
(() => {
  const INHALE = 4000, EXHALE = 6000, CYCLE = INHALE + EXHALE;
  const root = document.documentElement;
  const cue = document.getElementById("cue");
  const sub = document.getElementById("sub");
  const fill = document.getElementById("fill");
  const smile = document.getElementById("smile");
  const oh = document.getElementById("oh");
  const rounds = document.getElementById("rounds");
  const vibBtn = document.getElementById("vibBtn");
  const pauseBtn = document.getElementById("pauseBtn");

  const inhaleSubs = ["用鼻子，慢慢的", "肚子鼓起來", "讓空氣進來"];
  const exhaleSubs = ["慢慢吐出來", "肩膀放下來", "比吸氣更長一點", "把緊繃吐掉"];

  const canVibrate = "vibrate" in navigator;
  let vibrate = false;
  let paused = false;
  let start = performance.now();
  let pausedAt = 0;
  let lastPhase = null, lastTick = -1, cycles = 0;

  const ease = (x) => 0.5 - 0.5 * Math.cos(Math.PI * x); // gentle sine in-out

  function buzz(pattern) { if (vibrate && canVibrate) navigator.vibrate(pattern); }

  function setPhase(phase) {
    if (phase === "in") {
      cue.firstChild.textContent = "吸氣";
      sub.textContent = inhaleSubs[cycles % inhaleSubs.length];
      smile.setAttribute("opacity", "1"); oh.setAttribute("opacity", "0");
      buzz(25);
    } else {
      cue.firstChild.textContent = "吐氣";
      sub.textContent = exhaleSubs[cycles % exhaleSubs.length];
      smile.setAttribute("opacity", "0"); oh.setAttribute("opacity", "1");
      buzz(180); // one long soft buzz = start breathing out
    }
  }

  function frame(now) {
    if (!paused) {
      const t = (now - start) % CYCLE;
      const n = Math.floor((now - start) / CYCLE);
      let b, phase, p;
      if (t < INHALE) { phase = "in"; p = t / INHALE; b = ease(p); }
      else { phase = "out"; p = (t - INHALE) / EXHALE; b = 1 - ease(p); }

      root.style.setProperty("--b", b.toFixed(4));
      fill.style.width = (p * 100).toFixed(2) + "%";

      if (n !== cycles) {
        cycles = n;
        rounds.textContent = cycles === 1 ? "很好，再一次" : "已經呼吸了 " + cycles + " 次";
      }
      if (phase !== lastPhase) { lastPhase = phase; lastTick = 0; setPhase(phase); }
      // during inhale: a tiny tick each second so you can follow with eyes closed
      if (phase === "in") {
        const tick = Math.floor(t / 1000);
        if (tick !== lastTick && tick > 0) { lastTick = tick; buzz(12); }
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if (!canVibrate) {
    vibBtn.textContent = "此裝置不支援震動";
    vibBtn.disabled = true;
    vibBtn.style.opacity = ".5";
  }
  vibBtn.addEventListener("click", () => {
    vibrate = !vibrate;
    vibBtn.setAttribute("aria-pressed", vibrate);
    vibBtn.textContent = vibrate ? "震動 開" : "震動 關";
    if (vibrate) navigator.vibrate(30);
  });

  pauseBtn.addEventListener("click", () => {
    paused = !paused;
    if (paused) {
      pausedAt = performance.now();
      pauseBtn.textContent = "繼續";
      pauseBtn.setAttribute("aria-pressed", "true");
    } else {
      start += performance.now() - pausedAt;
      pauseBtn.textContent = "暫停";
      pauseBtn.setAttribute("aria-pressed", "false");
    }
  });
})();
</script>
</body>
</html>
